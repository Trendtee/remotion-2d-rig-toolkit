version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/remotion-demo
    schedule:
      interval: weekly
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
