name: Feature request
description: Suggest a pose, grip, helper or example.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to animate?
      description: Describe the shot or interaction, and what is hard to do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
