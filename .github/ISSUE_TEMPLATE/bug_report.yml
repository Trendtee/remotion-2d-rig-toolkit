name: Bug report
description: Something in the toolkit computes or renders incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. A minimal reproduction with numbers (points, lengths, frames) helps the most.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the function you called and the inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected geometry in screen coordinates (positive y points down).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: ts
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "toolkit 0.2.0, Node 24.x, Remotion 4.0.x (if used)"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Checks
      options:
        - label: I did not include secrets, tokens or artwork I am not allowed to share.
          required: true
